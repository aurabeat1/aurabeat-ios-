name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'App/**'
      - 'AuraBeatKit/**'
      - 'scripts/**'
      - '.github/workflows/build-ipa.yml'
  pull_request:
    paths:
      - 'App/**'
      - 'AuraBeatKit/**'
      - 'scripts/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if ls -d /Applications/Xcode_16*.app 1>/dev/null 2>&1; then
            XCODE_DIR=$(ls -d /Applications/Xcode_16*.app | tail -1)
            sudo xcode-select -s "$XCODE_DIR/Contents/Developer"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure Git for ONNX Runtime SPM mirror
        run: |
          git config --global url."https://github.com/TypeWhisper/onnxruntime-swift-package-manager.git".insteadOf "https://github.com/microsoft/onnxruntime-swift-package-manager"
          git config --global url."https://github.com/TypeWhisper/onnxruntime-swift-package-manager.git".insteadOf "https://github.com/microsoft/onnxruntime-swift-package-manager.git"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build IPA
        run: ./scripts/make-ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraBeat-IPA
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'AuraBeat iOS Latest IPA' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: build/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
